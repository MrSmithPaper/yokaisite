<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- 🧠 Appliquer dark-mode immédiatement -->
  <script>
    if (localStorage.getItem("dark-mode") === "enabled") {
      document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("dark-mode");
      });
    }
  </script>

  <!-- 🎨 Styles inline pour éviter les flashs visuels -->
  <style>
    html.dark-mode {
      background: #111;
      color: #eee;
    }
    html:not(.dark-mode) {
      background: #fff;
      color: #111;
    }
    html, body {
      transition: none !important;
    }
  </style>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yo-kai Watch Menu</title>

  <!-- 👾 Préchargement de styles et assets -->
  <link rel="preload" href="style.css" as="style">
  <link rel="preload" href="yokaiwatch.png" as="image">
  <link rel="preload" href="menu1.png" as="image">
  <link rel="preload" href="gear-icon.png" as="image">

  <!-- 🖋️ Fonts & styles -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <script>
    if (localStorage.getItem("dark-mode") === "enabled") {
      document.documentElement.classList.add("dark-mode");
    }
  </script>
  <link rel="stylesheet" href="style.css">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
</head>
<body class="preload">
  <div id="page-transition" class="transition-overlay"></div>
  <header>
    <img src="logo-yokai.png" alt="Logo Yo-kai Zone" class="site-logo">
  </header>

  <!-- Bouton pour ouvrir le cadran -->
  <div class="radial-menu-container">
    <button class="radial-button">
      <img src="yokaiwatch.png" alt="Ouvrir le cadran Yo-kai">
    </button>
  </div>

  <!-- Overlay flou -->
  <div class="overlay"></div>
  <div class="background-overlay"></div>

  <!-- Cadran Yo-kai central -->
  <div class="yokai-cadran">
    <img src="menu1.png" alt="Montre Yo-kai">
  <!-- Bouton paramètres au centre du cadran -->
  <a href="parametres.html" class="settings-button">
    <img src="gear-icon.png" alt="Paramètres" />
  </a>

    <svg class="radial-svg" viewBox="0 0 300 300">
      <defs>
        <path id="arc-accueil" d="M 40,160 A 110,110 0 0,1 160,40" />
        <path id="arc-yokai" d="M 160,40 A 110,110 0 0,1 260,160" />
        <path id="arc-infos" d="M 260,160 A 110,110 0 0,1 160,260" />
        <path id="arc-ressources" d="M 160,250 A 110,110 0 0,1 40,150" />
      </defs>

      <text class="arc arc-accueil">
        <a xlink:href="index.html">
          <textPath href="#arc-accueil" startOffset="50%" text-anchor="middle">Accueil</textPath>
        </a>
      </text>
      <text class="arc arc-yokai">
        <a xlink:href="yo-kai.html">
          <textPath href="#arc-yokai" startOffset="50%" text-anchor="middle">Yo-kai</textPath>
        </a>
      </text>
      <text class="arc arc-infos">
        <a xlink:href="infos.html">
          <textPath href="#arc-infos" startOffset="50%" text-anchor="middle">Infos</textPath>
        </a>
      </text>
      <text class="arc arc-ressources">
        <a xlink:href="ressources.html">
          <textPath href="#arc-ressources" startOffset="62%" text-anchor="middle">Ressources</textPath>
        </a>
      </text>
    </svg>
  </div>

  <section class="section" id="accueil">
    <h2>Accueil</h2>
    <p>Bienvenue dans l’univers Yo-kai&nbsp;!</p>
  </section>

  <section class="section" id="yokai">
    <h2>Yo-kai</h2>
    <p>Découvre les Yo-kai et leurs pouvoirs.</p>
  </section>

  <section class="section" id="infos">
    <h2>Infos</h2>
    <p>Dernières actualités et informations.</p>
  </section>

  <section class="section" id="ressources">
    <h2>Ressources</h2>
    <p>Guides, outils et téléchargements.</p>
  </section>

  <footer>
    Site développé avec ❤️ par Sasha.
  </footer>

<script src="script.js"></script>
<body class="preload">
</html>
